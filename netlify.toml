[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/share-image/:post/:version"
  to = "/.netlify/functions/happyad-share-image?post=:post&v=:version"
  status = 200
  force = true

[[redirects]]
  from = "/s/:post/:version"
  to = "/.netlify/functions/happyad-share-preview?post=:post&v=:version"
  status = 200
  force = true

[[redirects]]
  from = "/s/:post"
  to = "/.netlify/functions/happyad-share-preview?post=:post"
  status = 200
  force = true

[[headers]]
  for = "/modules/profile-stats.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/profile-stats.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

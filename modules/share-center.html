    .section{margin-top:14px}.contactsGrid,.searchResults{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 8px;padding:4px 0 12px}.person{min-width:0;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}.avatar{position:relative;width:62px;height:62px;min-width:62px;min-height:62px;max-width:62px;max-height:62px;border-radius:50%;background:#111d2d;border:2px solid rgba(141,159,190,.25);display:grid;place-items:center;overflow:visible;font-weight:900;line-height:1;isolation:isolate}.avatar>img{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;max-width:100%!important;max-height:100%!important;margin:0!important;padding:0!important;display:block!important;object-fit:cover!important;object-position:center!important;border-radius:50%!important;clip-path:circle(50% at 50% 50%)!important;overflow:hidden!important;transform:translateZ(0);z-index:1}.person.selected .avatar{border-color:#6276ff;box-shadow:0 0 0 3px rgba(83,100,255,.22)}.check{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:#5365ff;border:2px solid #03070d;display:none;place-items:center;font-size:13px;font-weight:900;z-index:3}.person.selected .check{display:grid}.nameRow{width:100%;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px}.name{min-width:0;max-width:78px;font-size:.72rem;line-height:1.1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe5ef}.nameBadge{position:relative;flex:0 0 auto;width:17px;height:17px;display:inline-block;vertical-align:-.18em;color:#fff;background:transparent;overflow:visible;font-size:0;line-height:1;clip-path:polygon(50% 0%,58% 12%,71% 6%,76% 20%,91% 22%,88% 38%,100% 50%,88% 62%,91% 78%,76% 80%,71% 94%,58% 88%,50% 100%,42% 88%,29% 94%,24% 80%,9% 78%,12% 62%,0% 50%,12% 38%,9% 22%,24% 20%,29% 6%,42% 12%);filter:drop-shadow(0 1px 3px rgba(0,0,0,.42))}.nameBadge::before{content:"";position:absolute;inset:0;clip-path:inherit;z-index:0}.nameBadge::after{content:"✓";position:absolute;top:50%;left:50%;transform:translate(-50%,-53%);color:#fff;font-size:10px;font-weight:1000;line-height:1;text-shadow:0 0 3px rgba(255,255,255,.78);z-index:1}.nameBadge.blue::before,.nameBadge.bleu::before{background:linear-gradient(135deg,#6fd4ff,#38b6ff,#0090ff);box-shadow:0 0 3px rgba(79,195,255,.48),0 0 8px rgba(0,120,255,.30)}.nameBadge.violet::before,.nameBadge.purple::before{background:linear-gradient(135deg,#e9d5ff,#c084fc,#9333ea);box-shadow:0 0 3px rgba(147,51,234,.48),0 0 8px rgba(109,40,217,.30)}.nameBadge.yellow::before,.nameBadge.jaune::before{background:linear-gradient(135deg,#ffe27a,#ffb020,#ff7a00);box-shadow:0 0 3px rgba(255,176,32,.48),0 0 8px rgba(255,122,0,.30)}.nameBadge.is-image{display:inline-grid;place-items:center;clip-path:none;border-radius:50%;overflow:hidden}.nameBadge.is-image::before,.nameBadge.is-image::after{display:none}.nameBadge img{width:100%;height:100%;display:block;object-fit:contain;border-radius:inherit}.empty{color:var(--muted);font-size:.84rem;padding:18px 4px;text-align:center}.loading{color:var(--muted);padding:16px 2px;font-size:.85rem;text-align:center}.contactSkeleton{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 8px;padding:20px 0 12px}.contactSkeleton span{display:flex;flex-direction:column;align-items:center;gap:8px}.contactSkeleton i{display:block;background:rgba(143,160,187,.13)}.contactSkeleton i:first-child{width:60px;height:60px;border-radius:50%}.contactSkeleton i:last-child{width:54px;height:9px;border-radius:9px}.share-permission-pending .appBtn,.share-permission-pending .send,.share-permission-denied .appBtn,.share-permission-denied .send{opacity:.48}.share-permission-pending .appBtn,.share-permission-pending .send,.share-permission-denied .appBtn,.share-permission-denied .send{pointer-events:none}.permissionNote{display:none;margin:8px 2px 0;color:var(--muted);font-size:.76rem;text-align:center}.share-permission-pending .permissionNote,.share-permission-denied .permissionNote{display:block}
    .story-share-mode .external{display:none!important}.story-share-mode .sendBar{padding-bottom:calc(12px + var(--safe-bottom))}.external{flex:0 0 auto;border-top:1px solid var(--line);background:linear-gradient(180deg,#0b0f15,#030507);padding:10px 14px calc(12px + var(--safe-bottom))}.externalTitle{font-size:.82rem;font-weight:800;margin-bottom:8px}.apps{display:flex;gap:13px;overflow-x:auto;scrollbar-width:none}.apps::-webkit-scrollbar{display:none}.appBtn{flex:0 0 64px;width:64px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}.appIcon{flex:0 0 50px;width:50px;height:50px;aspect-ratio:1/1;border-radius:15px;display:grid;place-items:center;overflow:hidden;background:transparent;box-shadow:0 4px 12px rgba(0,0,0,.24)}.appIcon img{width:100%;height:100%;max-width:100%;max-height:100%;display:block;object-fit:contain;object-position:center;aspect-ratio:1/1;border-radius:15px;image-rendering:auto}.appBtn[data-app="gmail"] .appIcon{background:#fff}.appBtn[data-app="copy"] .appIcon,.appBtn[data-app="more"] .appIcon{background:#101b2a}.appBtn span:last-child{font-size:.67rem;color:#cbd3df;white-space:nowrap}.sendBar{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:linear-gradient(180deg,#11161d,#070a0f)}.send{flex:1;height:48px;border:0;border-radius:16px;background:linear-gradient(135deg,#ff8c00,#ff7100);color:#101010;font-weight:950;cursor:pointer}.send:disabled{opacity:.4;cursor:not-allowed}.status{min-width:82px;color:var(--muted);font-size:.78rem;text-align:right}.toast{position:fixed;left:50%;bottom:calc(162px + var(--safe-bottom));transform:translate(-50%,20px);z-index:20;max-width:88%;padding:10px 14px;border-radius:13px;background:#18243a;color:white;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
    @media(max-width:350px){.contactsGrid,.searchResults{grid-template-columns:repeat(4,minmax(0,1fr));gap:13px 5px}.avatar{width:54px;height:54px;min-width:54px;min-height:54px;max-width:54px;max-height:54px}.name{max-width:64px;font-size:.67rem}.appBtn{flex-basis:58px;width:58px}.appIcon{width:44px;height:44px}}

<script>
(function(){
  'use strict';
  const MAX_SELECTED=20;
  const POST_MARKER='\u2063HAPPYAD_POST_V1\u2063';
  const STORY_MARKER='\u2063HAPPYAD_STORY_V1\u2063';
  let context={};
  let authUser=null;
  let selected=new Map();
  let recent=[];
  let blockedIds=new Set();
  let following=[];
  let followers=[];
  let directoryProfiles=[];
  let searchResults=[];
  let searchTimer=0;
  let searchToken=0;
  let sending=false;
  let permissionState='pending';
  let directoryLoaded=false;
  let directoryLoadedAt=0;
  let directoryLoading=null;
  const DIRECTORY_CACHE_PREFIX='HAPPYAD_SHARE_DIRECTORY_V715_';
  const DIRECTORY_FRESH_MS=45000;
  const $=id=>document.getElementById(id);
  const clean=v=>String(v==null?'':v).trim();
  const isUuid=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(clean(v));
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function client(){try{if(parent&&parent!==window){if(typeof parent.happyadSb==='function')return parent.happyadSb();if(parent.happyadSupabase)return parent.happyadSupabase;if(parent.supabaseClient)return parent.supabaseClient;}}catch(_e){}return null;}
  function avatarMaster(){return window.HappyProfileAvatarMasterV855R32||window.HappyProfileAvatarMaster||null;}
  function canonicalAvatar(id,fallback){const m=avatarMaster(),uid=clean(id);if(m&&uid){const entry=m.getEntry&&m.getEntry(uid);if(entry&&entry.known)return clean(entry.url);if(m.resolve)m.resolve(uid).catch(()=>{});return '';}return clean(fallback);}
  function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200);}
  function postParent(type,detail){try{parent.postMessage({type,detail:detail||{}},'*');}catch(_e){}}
  async function rpc(name,variants){const c=client();if(!c||!c.rpc)throw new Error('Connexion Supabase indisponible.');let last=null;for(const payload of variants){const r=await c.rpc(name,payload);if(!r.error)return r.data;last=r.error;const m=clean(last&&last.message).toLowerCase();if(!(last&&last.code==='PGRST202')&&!m.includes('function')&&!m.includes('schema cache'))break;}throw new Error(clean(last&&(last.message||last.details))||('Échec de '+name));}
  function rows(data){if(Array.isArray(data))return data;if(data&&Array.isArray(data.data))return data.data;if(data&&typeof data==='object')return [data];return [];}
  function first(data){return rows(data)[0]||{};}
  function profileName(p){return clean(p.full_name||p.display_name||p.name||p.username)||'Utilisateur HAPPYAD';}
  function profileAvatar(p){return clean(p.avatar_url||p.avatar||p.photo_url);}
  function profileBadgeUrl(p){const v=clean(p.badge_url||p.profile_badge_url||p.verified_badge_url||p.verification_badge_url||p.badge_image);return /^(?:data:image\/|blob:|https?:\/\/|\/|\.\/|\.\.\/)/i.test(v)?v:'';}
  function profileBadge(p){const v=clean(p.badge||p.user_badge||p.badge_type||p.certification||p.blue_badge||p.verifyBadge||p.verify_badge||p.verifiedBadge||p.verified_badge||p.role_badge||p.profile_badge||p.admin_badge||p.badge_color);if(/^(|aucun|none|false|0|null|undefined)$/i.test(v))return '';if(/^(1|true)$/i.test(v))return 'blue';return v;}
  function normalizeProfile(p){if(!p||!isUuid(p.id))return null;const id=clean(p.id);return {id:id,name:profileName(p),username:clean(p.username).replace(/^@+/,''),avatar:canonicalAvatar(id,profileAvatar(p)),badge:profileBadge(p),badgeUrl:profileBadgeUrl(p)};}
  function badgeIsImage(v){return /^(?:data:image\/|blob:|https?:\/\/|\/|\.\/|\.\.\/)/i.test(clean(v));}
  function badgeVariant(v){v=clean(v).toLowerCase();if(/violet|purple|creator/.test(v))return 'violet';if(/jaune|yellow|business|premium|seller/.test(v))return 'yellow';return 'blue';}
  function badgeHtml(v,url){url=clean(url);v=clean(v);const image=url||(badgeIsImage(v)?v:'');if(image)return '<i class="nameBadge is-image" title="Badge HAPPYAD officiel"><img src="'+esc(image)+'" alt="" loading="lazy" decoding="async"></i>';if(!v)return '';return '<i class="nameBadge '+badgeVariant(v)+'" aria-label="Badge HAPPYAD officiel" data-happyad-badge="'+esc(v)+'"></i>';}

  function uniqueIds(list){const out=[],seen=new Set();for(const id of list.map(clean)){if(!isUuid(id)||seen.has(id)||(authUser&&id===authUser.id))continue;seen.add(id);out.push(id);}return out;}
  function skeletonHtml(){return '<div class="contactSkeleton" aria-hidden="true">'+Array(8).fill('<span><i></i><i></i></span>').join('')+'</div>';}
  function setPermission(state){permissionState=/^(allowed|denied)$/.test(clean(state))?clean(state):'pending';document.body.classList.toggle('share-permission-pending',permissionState==='pending');document.body.classList.toggle('share-permission-denied',permissionState==='denied');const note=$('permissionNote');if(note)note.textContent=permissionState==='denied'?'Le partage est désactivé par le propriétaire.':'Vérification du partage…';updateSelection();}
  function cacheKey(uid){return DIRECTORY_CACHE_PREFIX+clean(uid);}
  function readDirectoryCache(uid){try{const raw=JSON.parse(localStorage.getItem(cacheKey(uid))||'null');if(!raw||raw.user_id!==uid||!Array.isArray(raw.recent)||!Array.isArray(raw.following)||!Array.isArray(raw.followers))return false;recent=raw.recent;following=raw.following;followers=raw.followers;directoryProfiles=recent.concat(following,followers);directoryLoadedAt=Number(raw.at)||0;if(directoryProfiles.length||raw.empty===true)renderDirectory();return true;}catch(_e){return false;}}
  function writeDirectoryCache(uid){try{localStorage.setItem(cacheKey(uid),JSON.stringify({user_id:uid,at:Date.now(),empty:directoryProfiles.length===0,recent:recent.slice(0,120),following:following.slice(0,160),followers:followers.slice(0,160)}));}catch(_e){}}
  async function getSession(){const c=client();if(!c||!c.auth)throw new Error('Session indisponible.');let u=null;try{const r=await c.auth.getSession();u=r&&r.data&&r.data.session&&r.data.session.user;}catch(_e){}if(!u){const r=await c.auth.getUser();u=r&&r.data&&r.data.user;}if(!u||!isUuid(u.id))throw new Error('Connectez-vous pour partager.');authUser=u;return u;}
  async function fetchProfiles(ids){ids=uniqueIds(ids);const map=new Map();const c=client(),m=avatarMaster();for(let i=0;i<ids.length;i+=80){const part=ids.slice(i,i+80),r=await c.from('profiles').select('*').in('id',part);if(r.error)throw r.error;if(m&&m.primeProfiles)m.primeProfiles(r.data||[],part,{source:'share-directory-v855r32',markMissing:true});(r.data||[]).forEach(p=>{const n=normalizeProfile(p);if(n)map.set(n.id,n);});}return map;}
  async function loadDirectory(force){
    if(directoryLoading)return directoryLoading;
    if(!authUser)await getSession();
    const me=authUser.id;
    if(!directoryProfiles.length)readDirectoryCache(me);
    if(!force&&directoryLoaded&&Date.now()-directoryLoadedAt<DIRECTORY_FRESH_MS){renderDirectory();return directoryProfiles;}
    if(!directoryProfiles.length)$('directory').innerHTML=skeletonHtml();
    directoryLoading=(async()=>{
      try{
        const c=client();
        const [convData,followingRes,followersRes,blockedOut,blockedIn]=await Promise.all([
          rpc('happyad_msg_list_conversations',[{p_limit:80,p_before_last_message_seq:null},{limit:80,before_last_message_seq:null},{}]).catch(()=>[]),
          c.from('happyad_follows').select('creator_id,created_at').eq('follower_id',me).order('created_at',{ascending:false}).limit(200),
          c.from('happyad_follows').select('follower_id,created_at').eq('creator_id',me).order('created_at',{ascending:false}).limit(200),
          Promise.resolve(c.from('happyad_msg_user_blocks').select('blocked_id').eq('blocker_id',me)).catch(()=>({data:[]})),
          Promise.resolve(c.from('happyad_msg_user_blocks').select('blocker_id').eq('blocked_id',me)).catch(()=>({data:[]}))
        ]);
        blockedIds=new Set();
        (blockedOut&&blockedOut.data||[]).forEach(r=>blockedIds.add(clean(r.blocked_id)));
        (blockedIn&&blockedIn.data||[]).forEach(r=>blockedIds.add(clean(r.blocker_id)));
        const conversationIds=rows(convData).map(r=>clean(r.target_user_id||r.other_user_id||r.peer_user_id||r.recipient_id)).filter(id=>!blockedIds.has(id));
        const followingIds=(followingRes&&followingRes.data||[]).map(r=>clean(r.creator_id)).filter(id=>!blockedIds.has(id));
        const followerIds=(followersRes&&followersRes.data||[]).map(r=>clean(r.follower_id)).filter(id=>!blockedIds.has(id));
        const followerSet=new Set(followerIds);
        const friendIds=followingIds.filter(id=>followerSet.has(id));
        const recentIds=friendIds.concat(conversationIds.filter(id=>!friendIds.includes(id)));
        const all=uniqueIds(recentIds.concat(followingIds,followerIds));
        const profiles=await fetchProfiles(all);
        const used=new Set();
        function build(ids){const out=[];for(const id of uniqueIds(ids)){if(used.has(id)||!profiles.has(id))continue;used.add(id);out.push(profiles.get(id));}return out;}
        recent=build(recentIds);following=build(followingIds);followers=build(followerIds);
        directoryProfiles=recent.concat(following,followers);directoryLoaded=true;directoryLoadedAt=Date.now();writeDirectoryCache(me);renderDirectory();return directoryProfiles;
      }catch(error){
        if(!directoryProfiles.length)$('directory').innerHTML='<div class="empty">Contacts indisponibles. Utilisez la recherche.</div>';
        if(!directoryProfiles.length)toast(clean(error&&error.message)||'Chargement impossible.');
        return directoryProfiles;
      }finally{directoryLoading=null;}
    })();
    return directoryLoading;
  }
  async function ensureDirectory(force){
    try{if(!authUser)await getSession();if(!directoryProfiles.length)readDirectoryCache(authUser.id);if(directoryProfiles.length)renderDirectory();return await loadDirectory(!!force);}catch(error){if(!directoryProfiles.length)$('directory').innerHTML='<div class="empty">Connectez-vous pour envoyer dans les inbox HAPPYAD.</div>';return [];}
  }
  function personHtml(p){const initial=esc((p.name||'H').slice(0,1).toUpperCase());const av=p.avatar?'<img src="'+esc(p.avatar)+'" alt="">':initial;return '<button class="person'+(selected.has(p.id)?' selected':'')+'" type="button" data-person="'+esc(p.id)+'"><span class="avatar">'+av+'<i class="check">✓</i></span><span class="nameRow"><span class="name">'+esc(p.name)+'</span>'+badgeHtml(p.badge,p.badgeUrl)+'</span></button>';}

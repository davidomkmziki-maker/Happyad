<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAPPYAD Profil</title><script>(function(){try{var q=new URLSearchParams(location.search||''),uid=q.get('uid')||q.get('user_id')||q.get('profile_uid')||'';var visitor=q.get('public')==='1'||!!uid;var target=visitor?'visitor-profile.html':'my-profile.html';if(visitor&&uid){q.delete('public');q.set('uid',uid);target+='?'+q.toString();}location.replace(target);}catch(e){location.replace('my-profile.html');}})();</script></head><body style="margin:0;background:#020303"></body></html>

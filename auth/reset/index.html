<html lang="fr">
<head>

<title>Récupération HAPPYAD</title>
<style>html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:420px}.spin{width:42px;height:42px;margin:0 auto 16px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:s .75s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#b8beca;font-weight:700}</style>
</head>
<body>
<div class="box"><div class="spin"></div><p>Ouverture sécurisée de la récupération du compte…</p></div>
<script>
(function(){
  'use strict';
  var target='/reset-password.html'+String(location.search||'')+String(location.hash||'');
  try{location.replace(target);}catch(_e){location.href=target;}
})();
</script>
</body>
